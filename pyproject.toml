[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "filemind-ai"
version = "2.6.2"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
description = "FileMind local organizer and central DeviceLink workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7,<7",
    "pydantic>=2.8,<3",
    "watchdog>=6,<7",
    "httpx>=0.27,<1",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9,<1", "httpx2"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2", "psutil>=6,<8"]

[project.gui-scripts]
filemind = "filemind.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filemind_server = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra --basetemp=.pytest_tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
