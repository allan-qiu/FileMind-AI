name: Build Windows release assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      FILEMIND_ALLOW_PAID_AI: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.4.0"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install PyInstaller==6.22.3
      - run: python scripts/prepare_github_release.py --check .
      - run: python -m pytest -q
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: dotnet tool install --tool-path .artifacts/wix wix --version 5.0.2
      - run: python scripts/build_windows_installer.py --wix .artifacts/wix/wix.exe --output .artifacts/windows-release
      - run: python scripts/release.py --series 2.6.3 --stage GitHub --final-names
      - name: Assemble release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item .artifacts/windows-release/*.msi dist/release/
          Copy-Item deliveries/V2.6.3/GitHub/*.zip dist/release/
          Copy-Item deliveries/V2.6.3/GitHub/*清单.json dist/release/
          Get-ChildItem dist/release -File | Sort-Object Name | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$digest  $($_.Name)"
          } | Set-Content dist/release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: filemind-windows-release-assets
          path: dist/release/
          if-no-files-found: error
