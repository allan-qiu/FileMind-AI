# LOCAL V2.6 TEMPLATE ONLY. Separate virtual host; never overwrite the question-bank vhost.
# Replace the domain/certificate paths after approval; run nginx -t before reload.
# Include at http{} scope. Zones are FileMind-specific, never shared with question-bank.
limit_req_zone $binary_remote_addr zone=filemind_ingest:1m rate=4r/s;
limit_conn_zone $server_name zone=filemind_connections:1m;
server {
    listen 443 ssl;
    server_name filemind.example.invalid;
    ssl_certificate /etc/filemind/tls/fullchain.pem;
    ssl_certificate_key /etc/filemind/tls/privkey.pem;
    client_max_body_size 1m;
    client_body_timeout 35s;
    send_timeout 35s;
    access_log off;
    limit_conn filemind_connections 8;
    limit_req_status 429;
    limit_conn_status 429;
    limit_rate 1m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 180s;
    location ~ ^/api/(archive/jobs|shares/temporary/uploads)/[^/]+/chunks/ {
        # 4 x 256 KiB chunk requests/sec/IP; approximate upload shaping, not a byte quota.
        limit_req zone=filemind_ingest burst=4;
        proxy_pass http://127.0.0.1:18765;
    }
    location / {
        proxy_pass http://127.0.0.1:18765;
    }
}
