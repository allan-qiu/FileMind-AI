# LOCAL TEMPLATE ONLY. Separate virtual host; never overwrite the question-bank vhost.
# Replace the domain/certificate paths after approval; run nginx -t before reload.
server {
    listen 443 ssl;
    server_name filemind.example.invalid;
    ssl_certificate /etc/filemind/tls/fullchain.pem;
    ssl_certificate_key /etc/filemind/tls/privkey.pem;
    client_max_body_size 1m;
    client_body_timeout 35s;
    send_timeout 35s;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
